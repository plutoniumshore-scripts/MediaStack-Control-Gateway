name: Assemble gateway update

on:
  push:
    branches:
      - gateway-v3.4.10-update
    paths:
      - .github/workflows/assemble-gateway-update.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: gateway-v3.4.10-update
          fetch-depth: 0

      - name: Reconstruct validated installer
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/installer.part* | base64 -d | gzip -d > Install-MediaStack-Control-Gateway.ps1
          echo "24b179e2726315614720975df2c87fa205fb883a3cdbc465b1970064917d828f  Install-MediaStack-Control-Gateway.ps1" | sha256sum -c -
          rm -rf .publish
          rm -f .github/workflows/assemble-gateway-update.yml

      - name: Commit reconstructed installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble gateway installer"
          git push origin HEAD:gateway-v3.4.10-update
